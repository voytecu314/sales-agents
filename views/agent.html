<!doctype html>
<html lang="%%LANG%%">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>%%TITLE%%</title>
  <meta name="description" content="%%DESCRIPTION%%">
  <meta name="theme-color" content="%%BG%%">
  <meta property="og:type" content="website">
  <meta property="og:title" content="%%TITLE%%">
  <meta property="og:description" content="%%DESCRIPTION%%">
  <meta property="og:url" content="%%OG_URL%%">
  %%HEAD_IMAGE%%
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/chat.css">
  <style>%%THEME_CSS%%</style>
  %%HEAD_EXTRA%%
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <h1>%%BRAND_MARK%%<span id="brand-name">%%NAME%%</span></h1>
        <p id="tagline">%%TAGLINE%%</p>
      </div>
      <div class="actions">
        <select id="lang" class="lang" aria-label="%%LANG_LABEL%%">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
          <option value="pl">Polski</option>
        </select>
        <button id="reset" type="button" class="ghost">%%NEW_CHAT%%</button>
      </div>
      %%TOP_RIGHT%%
    </header>

    <section id="feed" class="feed" aria-live="polite"></section>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="prompt" rows="1" placeholder="%%PLACEHOLDER%%" aria-label="%%COMPOSER_LABEL%%"></textarea>
      <button id="send" type="submit">%%SEND%%</button>
    </form>

    <footer class="foot"><span id="foot-ai">%%AI_LABEL%%</span>%%REPORT_BTN%% · <button id="clear-history" type="button" class="linklike">Clear history</button> · <a id="privacy" class="linklike" href="%%PRIVACY_URL%%">%%PRIVACY%%</a>%%LEGAL_LINKS%%</footer>
  </main>

  <!-- public config of this agent: branding and texts only, never the system prompt -->
  <script type="application/json" id="agent-config">%%CONFIG_JSON%%</script>
  <script src="/app.js"></script>
</body>
</html>
